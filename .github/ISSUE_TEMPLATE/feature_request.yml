name: Feature request
description: An idea for something StarRate should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write in **English or German**, whichever suits you.

        The most useful requests describe the *situation*, not the solution — what you
        were doing when you wished for it. That often leads somewhere better than the
        feature as first imagined.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The moment in your workflow where StarRate gets in the way.
      placeholder: |
        After a shoot I send the client a guest link with 600 photos. They pick their
        favorites, and then I have to find those again in Lightroom by hand.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: If you already have a shape in mind, describe it — mockups are welcome. If not, that's fine too.

  - type: input
    id: workflow
    attributes:
      label: What do you shoot, and who rates?
      description: Helps to judge how common the situation is.
      placeholder: "Weddings, RAW+JPEG, I cull first and the couple picks via guest link"

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Another program, a workaround, or simply not at all.

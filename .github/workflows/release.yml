name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z.B. 1.2.0) – muss mit appinfo/info.xml übereinstimmen'
        required: true
        type: string
      nightly:
        description: 'Nightly-Release? (nur für experimentelle Versionen, nicht für normale Nutzer sichtbar)'
        required: false
        type: boolean
        default: false

jobs:

  # ── Build & Package ──────────────────────────────────────────────────────────
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Validate branch matches release type
        run: |
          BRANCH="${{ github.ref_name }}"
          NIGHTLY="${{ inputs.nightly }}"
          echo "Branch : $BRANCH"
          echo "Nightly: $NIGHTLY"
          if [ "$NIGHTLY" = "true" ] && [ "$BRANCH" != "nightly" ]; then
            echo "ERROR: Nightly releases must be triggered from the 'nightly' branch (got: $BRANCH)."
            exit 1
          fi
          if [ "$NIGHTLY" = "false" ] && [ "$BRANCH" != "master" ]; then
            echo "ERROR: Stable releases must be triggered from the 'master' branch (got: $BRANCH)."
            exit 1
          fi
          echo "Branch check passed ✓"

      - name: Validate version matches appinfo/info.xml
        run: |
          XML_VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          echo "Input version : ${{ inputs.version }}"
          echo "info.xml version: $XML_VERSION"
          if [ "$XML_VERSION" != "${{ inputs.version }}" ]; then
            echo "ERROR: Version mismatch! Bump the version in appinfo/info.xml and package.json first."
            exit 1
          fi
          echo "Version check passed ✓"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install JS dependencies
        run: npm ci

      - name: Build JS bundle
        run: npm run build

      - name: Install Composer dependencies (no-dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Create release archive
        run: |
          mkdir -p dist
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.claude' \
            --exclude='./.gitignore' \
            --exclude='./.npmrc' \
            --exclude='./.env*' \
            --exclude='./node_modules' \
            --exclude='./vendor/bin' \
            --exclude='./tests' \
            --exclude='./src' \
            --exclude='./docker' \
            --exclude='./docs' \
            --exclude='./screenshots' \
            --exclude='./dist' \
            --exclude='./build' \
            --exclude='./*.cy.js' \
            --exclude='./*.spec.js' \
            --exclude='./*.stackdump' \
            --exclude='./*.ico' \
            --exclude='./CLAUDE.md' \
            --exclude='./README.md' \
            --exclude='./Makefile' \
            --exclude='./cypress.config.cjs' \
            --exclude='./vite.config.js' \
            --exclude='./vitest.config.js' \
            --exclude='./phpunit.xml' \
            --exclude='./composer.json' \
            --exclude='./composer.lock' \
            --exclude='./package.json' \
            --exclude='./package-lock.json' \
            --transform 's|^\./|starrate/|' \
            --transform 's|^\.$|starrate|' \
            -czf dist/starrate.tar.gz \
            .

      - name: Verify archive contains required files
        run: |
          echo "Checking required files..."
          tar -tzf dist/starrate.tar.gz | grep -q 'starrate/vendor/autoload.php' \
            && echo "  ✓ vendor/autoload.php" \
            || (echo "  ✗ vendor/autoload.php MISSING" && exit 1)
          tar -tzf dist/starrate.tar.gz | grep -q 'starrate/vendor/composer/autoload_psr4.php' \
            && echo "  ✓ vendor/composer/autoload_psr4.php" \
            || (echo "  ✗ autoload_psr4.php MISSING" && exit 1)
          tar -tzf dist/starrate.tar.gz | grep -q 'starrate/appinfo/info.xml' \
            && echo "  ✓ appinfo/info.xml" \
            || (echo "  ✗ appinfo/info.xml MISSING" && exit 1)
          echo "All required files present ✓"

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: starrate-package
          path: dist/starrate.tar.gz
          retention-days: 1

  # ── Install test (NC 33 = Produktionsbasis, NC 35 = neueste Major) ─────────
  install-test:
    name: Install test (NC ${{ matrix.nc }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nc: ['33', '35']

    steps:
      - name: Start Nextcloud ${{ matrix.nc }}
        run: |
          docker run -d --name nc             -p 8080:80             -e NEXTCLOUD_ADMIN_USER=admin             -e NEXTCLOUD_ADMIN_PASSWORD=admin             -e NEXTCLOUD_TRUSTED_DOMAINS=localhost             -e SQLITE_DATABASE=nextcloud             nextcloud:${{ matrix.nc }}
          echo "Waiting for Nextcloud to initialize (up to 120s)..."
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(curl -sf http://localhost:8080/status.php 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('installed',''))" 2>/dev/null || echo "")
            echo "  Attempt $i: installed=$STATUS"
            [ "$STATUS" = "True" ] && echo "Nextcloud ready ✓" && break
            [ "$i" = "24" ] && echo "Timeout waiting for NC" && exit 1
          done
          docker exec -u www-data nc php occ status | grep versionstring

      - name: Download archive artifact
        uses: actions/download-artifact@v4
        with:
          name: starrate-package

      - name: Install app into Nextcloud
        run: |
          tar -xzf starrate.tar.gz -C /tmp/
          docker cp /tmp/starrate nc:/var/www/html/custom_apps/

      - name: Enable app and verify version
        run: |
          # Ohne --force: scheitert, wenn info.xml max-version die NC-Version nicht abdeckt
          RESULT=$(docker exec -u www-data nc php occ app:enable starrate 2>&1)
          echo "$RESULT"
          echo "$RESULT" | grep -q "enabled" || (echo "App enable failed!" && exit 1)
          echo "$RESULT" | grep -q "${{ inputs.version }}"             && echo "Version ${{ inputs.version }} confirmed ✓"             || echo "Warning: could not confirm version ${{ inputs.version }} in output (non-fatal)"

      - name: Smoke test — no PHP fatal errors
        run: |
          RESULT=$(docker exec -u www-data nc php occ app:check starrate 2>&1 || true)
          echo "$RESULT"
          echo "$RESULT" | grep -qiE "fatal|Uncaught|class.*not found|namespace"             && (echo "Fatal PHP error detected!" && exit 1)             || echo "No fatal PHP errors ✓"
          docker exec -u www-data nc php occ app:list --enabled 2>&1             | grep -q "starrate"             && echo "App enabled ✓"             || (echo "App missing from enabled list!" && exit 1)

      - name: Runtime smoke — gallery + guest route
        run: |
          # Echte Requests gegen Controller + Templates: fängt entfernte Core-APIs,
          # die erst zur Laufzeit knallen (z.B. #89, NC34 Magic-Getter → HTTP 500)
          docker exec nc bash -c 'cp /var/www/html/data/nextcloud.log /tmp/base.log 2>/dev/null || touch /tmp/base.log'
          GAL=$(curl -s -o /tmp/gal.html -w "%{http_code}" -u admin:admin -H "OCS-APIRequest: true" http://localhost:8080/index.php/apps/starrate/)
          API=$(curl -s -o /tmp/api.json -w "%{http_code}" -u admin:admin -H "OCS-APIRequest: true" "http://localhost:8080/index.php/apps/starrate/api/images?path=/")
          GST=$(curl -s -o /tmp/gst.html -w "%{http_code}" http://localhost:8080/index.php/apps/starrate/guest/doesnotexist)
          echo "gallery=$GAL  api/images=$API  guest(invalid token)=$GST"
          head -c 300 /tmp/api.json; echo
          docker exec nc bash -c 'tail -n +$(( $(wc -l < /tmp/base.log) + 1 )) /var/www/html/data/nextcloud.log 2>/dev/null' | tee /tmp/new.log
          if grep -qiE "Call to undefined method|Fatal error|Uncaught Error|Uncaught Exception" /tmp/new.log /tmp/gal.html /tmp/gst.html; then
            echo "Fatal error detected!"; exit 1
          fi
          [ "$GAL" = "200" ] || (echo "Gallery route: $GAL" && exit 1)
          [ "$API" = "200" ] || (echo "Images API: $API" && exit 1)
          [ "$GST" -lt 500 ] || (echo "Guest route: $GST" && exit 1)
          echo "Runtime smoke OK on NC ${{ matrix.nc }} ✓"

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: install-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archive artifact
        uses: actions/download-artifact@v4
        with:
          name: starrate-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: starrate.tar.gz
          generate_release_notes: true

  # ── Nextcloud App Store ──────────────────────────────────────────────────────
  appstore:
    name: Nextcloud App Store
    needs: release
    if: inputs.nightly != true
    runs-on: ubuntu-latest

    steps:
      - name: Upload to Nextcloud App Store
        env:
          NC_APP_STORE_TOKEN: ${{ secrets.NC_APP_STORE_TOKEN }}
          NC_APP_STORE_SIGNING_KEY: ${{ secrets.NC_APP_STORE_SIGNING_KEY }}
        run: |
          if [ -z "$NC_APP_STORE_TOKEN" ] || [ -z "$NC_APP_STORE_SIGNING_KEY" ]; then
            echo "NC_APP_STORE_TOKEN or NC_APP_STORE_SIGNING_KEY not set — cannot upload."
            exit 1
          fi
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/starrate.tar.gz"
          echo "Downloading release archive for signing..."
          curl -sL "$DOWNLOAD_URL" -o /tmp/starrate.tar.gz
          echo "Signing archive..."
          echo "$NC_APP_STORE_SIGNING_KEY" | base64 -d > /tmp/starrate.key
          SIGNATURE=$(openssl dgst -sha512 -sign /tmp/starrate.key /tmp/starrate.tar.gz | openssl base64 -A)
          rm -f /tmp/starrate.key
          NIGHTLY="${{ inputs.nightly }}"
          echo "Uploading: $DOWNLOAD_URL (nightly=$NIGHTLY)"
          HTTP_STATUS=$(curl -s -o /tmp/appstore_response.json -w "%{http_code}" \
            -X POST https://apps.nextcloud.com/api/v1/apps/releases/ \
            -H "Authorization: Token $NC_APP_STORE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"download\": \"$DOWNLOAD_URL\", \"signature\": \"$SIGNATURE\", \"nightly\": $NIGHTLY}")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/appstore_response.json
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "App Store upload successful ✓"
          else
            echo "App Store upload failed with status $HTTP_STATUS"
            exit 1
          fi
